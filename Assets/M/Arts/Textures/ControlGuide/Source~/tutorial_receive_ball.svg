<title id="title">선택해서 공 받기</title>
<desc id="desc">공을 가리키고 선택해서 받아요。주황 농구공과 열린 받침 손, 작은 선택 조준점. 꽉 쥐는 그립이나 손 추적 제스처로 표현하지 않음.</desc>
