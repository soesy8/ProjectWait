<title id="title">왼손 스틱으로 이동</title>
<desc id="desc">왼손 스틱을 기울여 이동해요。L 표시가 있는 왼손 컨트롤러. 스틱과 네 방향 화살표를 강조. 스틱 클릭 표시 없음.</desc>
