<title id="title">눈높이 맞추기</title>
<desc id="desc">메뉴에서 높이 맞추기를 선택하고 정면을 봐요。정면 헤드셋, 눈높이 점선과 수직 눈금. 스틱·키 조합을 새로 만들지 않음.</desc>
