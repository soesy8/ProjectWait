<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">레이로 가리키기</title>
<desc id="desc">컨트롤러의 레이를 대상에 맞춰요。일반 컨트롤러에서 목표 조준점으로 이어지는 청록 레이. 특정 손이나 전용 버튼을 요구하지 않음.</desc>
