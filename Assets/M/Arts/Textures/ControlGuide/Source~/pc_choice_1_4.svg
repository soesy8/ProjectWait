<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">숫자로 선택지 고르기</title>
<desc id="desc">표시된 선택지는 1–4 키로도 골라요。1·2·3·4 키를 동일 색상으로 표시. 정답 키를 별도 색상으로 암시하지 않음. 물체 선택 대체가 아님.</desc>
