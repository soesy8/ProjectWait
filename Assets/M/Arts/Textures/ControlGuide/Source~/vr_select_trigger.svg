<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">검지 트리거로 선택</title>
<desc id="desc">가리킨 뒤 검지 트리거를 한 번 눌러요。옆에서 본 컨트롤러의 상단 앞쪽 검지 트리거를 주황색으로 강조. 손잡이 그립은 강조하지 않음.</desc>
